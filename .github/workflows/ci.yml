name: CI

# Eventos que disparan este workflow (ver docs/github/05-actions.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # botón para lanzarlo a mano desde la pestaña Actions

jobs:
  test:
    runs-on: ubuntu-latest  # runner hospedado por GitHub, efímero
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar Java (PySpark corre sobre la JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar el proyecto y dependencias de dev
        run: pip install -e ".[dev]"

      - name: Correr los tests
        run: pytest
