[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drifting-minsky"
version = "0.1.0"
description = "Pipeline ETL de e-commerce con PySpark para practicar Git en flujos de equipo."
requires-python = ">=3.11"
dependencies = [
    "pyspark==3.5.*",
    "faker>=30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
